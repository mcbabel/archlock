# Publishes archlock to npm with provenance when the "chore: release" pull request is merged.
# Authenticates via npm Trusted Publishing (OIDC) for this workflow file; no npm token is needed.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10. pnpm publish uses this npm.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - name: Create the release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: changesets/action writes no .npmrc and npm authenticates via OIDC.
          # Sigstore retries the non-idempotent tlog upload and then fails with 409; publish
          # without retries. Provenance is set by publishConfig.provenance in package.json.
          NPM_CONFIG_FETCH_RETRIES: "0"

      # The GitHub Action is referenced as mcbabel/archlock@v0: move that tag to each release.
      - name: Move the v0 tag for the GitHub Action
        if: steps.changesets.outputs.published == 'true'
        run: |
          git tag -f v0
          git push -f origin v0
