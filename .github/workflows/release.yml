# Publishes archlock to npm with provenance when the "chore: release" pull request is merged.
# Authentication uses npm Trusted Publishing (OIDC): npmjs.com trusts this workflow file
# (mcbabel/archlock, .github/workflows/release.yml), so no npm token or secret is needed.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships npm 10. pnpm publish hands the
      # upload to this npm.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - name: Create the release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: changesets/action then writes no .npmrc and npm authenticates via OIDC.
          # Provenance is enabled once, by publishConfig.provenance in package.json.
          # npm passes fetch-retries to Sigstore, which then retries the (non-idempotent) upload of
          # the provenance entry to the transparency log. If the log stored the entry but the
          # response was lost, the retry fails with 409 TLOG_CREATE_ENTRY_ERROR and the package is
          # not published. Without retries the entry is submitted exactly once; a failed publish
          # can simply be re-run, because nothing reaches npm before the entry is logged.
          NPM_CONFIG_FETCH_RETRIES: "0"

      # The GitHub Action is referenced as mcbabel/archlock@v0: move that tag to each release.
      - name: Move the v0 tag for the GitHub Action
        if: steps.changesets.outputs.published == 'true'
        run: |
          git tag -f v0
          git push -f origin v0
